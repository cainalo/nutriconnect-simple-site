# Verificações a cada envio para main/prod e em cada PR: tipos, lint, testes de unidade,
# varredura de segredos (sem imprimir valores) e os testes de acesso do banco (PGlite, sem
# banco real). Não publica nada e não usa nenhum segredo.
name: Verificações

on:
  push:
    branches: [main, prod]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verificacoes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a varredura de segredos olha todo o histórico

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # O lock oficial do projeto é o bun.lock (mantido pelo Lovable).
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Tipos
        run: npx tsc --noEmit -p .

      # Só regras de código: a formatação depende da versão do prettier de cada máquina.
      - name: Lint
        run: |
          npx eslint src tests scripts --rule "prettier/prettier: off"

      - name: Build do site
        run: npx vite build

      - name: Testes de unidade
        run: npm test

      - name: Segredos (código e histórico)
        run: python3 scripts/auditoria/varrer-segredos.py

      - name: Testes de acesso do banco (PGlite)
        run: |
          mkdir -p /tmp/pg && cd /tmp/pg
          npm init -y >/dev/null
          npm i @electric-sql/pglite@0.2.17 >/dev/null
          cp "$GITHUB_WORKSPACE/supabase/tests/run-local.mjs" .
          node run-local.mjs "$GITHUB_WORKSPACE" | tee resultado.txt
          grep -q " 0 falharam" resultado.txt

  # Varredura de todas as páginas no navegador (harness com dados sintéticos): 4 designs, claro e
  # escuro, celular; rolagem lateral, alvos de toque, erros de JavaScript e WCAG (axe-core).
  telas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Ferramentas de teste em versões fixas, fora do lockfile do app (que é do Lovable).
      - name: Playwright e axe-core
        run: |
          mkdir -p /tmp/e2e && cd /tmp/e2e
          npm init -y >/dev/null
          npm i playwright-core@1.56.1 axe-core@4.10.2 >/dev/null
          npx playwright-core install --with-deps chromium

      - name: Varredura das telas
        env:
          E2E_TOOLS: /tmp/e2e
        run: |
          node tests/e2e/smoke.mjs --widths 390 --axe --dark \
            --designs natural,vibrante,editorial,aurora

      - name: Relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-telas
          path: tests/e2e/out/
