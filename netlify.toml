# A URL, o ID do projeto, a chave publishable/anon do Supabase e a chave VAPID pública
# são públicas por natureza (vão para o JavaScript do navegador; os dados são protegidos
# por RLS).
# Sem isto, o secrets scanning do Netlify derruba o build por encontrá-los no repo.
# Nunca coloque aqui chaves de serviço (service_role/sb_secret) nem do Mercado Pago.
# O Nitro detecta o Netlify no build (preset "netlify"): estáticos em dist/, SSR em .netlify/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_PROJECT_ID,SUPABASE_PUBLISHABLE_KEY,SUPABASE_URL,VITE_SUPABASE_PROJECT_ID,VITE_SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_URL,VITE_VAPID_PUBLIC_KEY,VAPID_PUBLIC_KEY"

# A4: verificação dos links que abrem o app Android (App Links).
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
